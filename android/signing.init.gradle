gradle.beforeProject { project ->
    project.plugins.withId('com.android.application') {
        def android = project.extensions.getByName('android')
        android.defaultConfig.ndk.abiFilters.add('arm64-v8a')
        def signing = android.signingConfigs.maybeCreate('pomodoroRelease')
        def requireEnv = { String name ->
            def value = System.getenv(name)
            if (!value) throw new GradleException("Missing required release signing variable: " + name)
            return value
        }
        signing.storeFile = project.file(requireEnv('POMODORO_STORE_FILE'))
        signing.storePassword = requireEnv('POMODORO_STORE_PASSWORD')
        signing.keyAlias = requireEnv('POMODORO_KEY_ALIAS')
        signing.keyPassword = requireEnv('POMODORO_KEY_PASSWORD')
        android.buildTypes.getByName('release').signingConfig = signing
    }
}
